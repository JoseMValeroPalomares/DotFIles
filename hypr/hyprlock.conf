# /* ---- 💫 HYPRLOCK - ARCH HACKER SPLIT EDITION (ELEGANT SYNC) 💫 ---- */  #

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    immediate_render = true
    hide_cursor = false
}

# ==========================================
# 🌌 FONDO
# ==========================================

background {
    monitor =
    path = ~/.config/hypr/hyprlock.png 
    blur_passes = 3
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# ==========================================
# 🟩 COLUMNA IZQUIERDA: LOGIN
# ==========================================

# LOGO ARCH
label {
    monitor =
    text = 󰣇
    color = $color13
    font_size = 80
    position = 120, 200
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = $color13
}

# FOTO PERFIL
image {
    monitor =
    path = $HOME/.config/hypr/profile.png 
    border_size = 4
    border_color = $color13
    size = 150
    rounding = -1
    position = 260, 200
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = $color13
}

# CAJA USUARIO
shape {
    monitor =
    size = 320, 55
    color = rgba(0, 0, 0, 0.6)
    rounding = 20
    border_size = 2
    border_color = $color13
    position = 120, 0
    halign = left
    valign = center
}

# TEXTO USUARIO
label {
    monitor =
    text =   $USER
    color = $foreground
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold
    position = 145, 0
    halign = left
    valign = center
}

# CAMPO PASSWORD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.3 
    dots_center = true
    outer_color = $color13
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = $foreground
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Bold
    placeholder_text = <i><span foreground="##ffffff99">󰌾  Introducir clave</span></i>
    hide_input = false
    rounding = 20
    position = 120, -75
    halign = left
    valign = center
    shadow_passes = 2
}

# ==========================================
# 🟦 COLUMNA DERECHA: INFO
# ==========================================

# HORA
label {
    monitor =
    text = $TIME
    color = $color13
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = -120, 200

    halign = right
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.5)
}

# FECHA
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d de %B")"
    color = $foreground
    font_size = 30
    font_family = JetBrainsMono Nerd Font Bold
    position = -125, 80
    halign = right
    valign = center
}

# ==========================================
# 🔻 INFERIOR DERECHA: STATS
# ==========================================

# CLIMA
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = $color8
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -150, 380
    halign = right
    valign = bottom
}

# BATERÍA
label {
    monitor =
    text = cmd[update:1000] echo "<b>$($Scripts/Battery.sh)</b>"
    color = $color13
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -125, 60
    halign = right
    valign = bottom
}

# UPTIME
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(uptime -p || $Scripts/UptimeNixOS.sh)</b>"
    color = $color13
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -125, 35
    halign = right
    valign = bottom
}

# ==========================================
# 🎵 INFERIOR IZQUIERDA: SPOTIFY
# ==========================================

shape {
    monitor =
    size = 320, 50
    color = rgba(0, 0, 0, 0.6)
    rounding = 20
    border_size = 2
    border_color = $color13
    position = 120, 50
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "  $($Scripts/spotify.sh)" 
    color = $foreground
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 140, 65
    halign = left
    valign = bottom
}