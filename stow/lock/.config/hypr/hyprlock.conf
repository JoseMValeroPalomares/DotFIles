# /* ---- 💫 HYPRLOCK - ARCH HACKER SPLIT EDITION (ELEGANT SYNC) 💫 ---- */  #

# Colores de reserva: si faltan los archivos de Wallust, el bloqueo sigue siendo legible.
$background = rgb(1e1e2e)
$foreground = rgb(e6e6e6)
$color7 = rgb(c8c8c8)
$color8 = rgb(9a9a9a)
$color13 = rgb(89b4fa)
$color14 = rgb(a6c8ff)
$accent_soft = rgba(89b4fa73)
$accent_glow = rgba(89b4fa99)
$surface = rgba(1e1e2ea6)
# Paleta del escritorio y, encima, la del fondo del bloqueo (UserScripts/HyprlockBackground.sh)
source = $HOME/.config/hypr/wallust/wallust-hyprlock.conf
source = $HOME/.cache/hyprlock/colors.conf
$Scripts = $HOME/.config/hypr/scripts

# Monitor del bloqueo: el HDMI si está conectado, si no el del portátil; el otro en negro.
# Lo escribe scripts/HyprlockMonitor.sh justo antes de bloquear (lock_cmd de hypridle).
# Valor por defecto vacío = todos los monitores: si falta el archivo, se ve en ambos.
$LOCK_MONITOR =
$LOCK_OTHER = none
source = $HOME/.cache/hyprlock/monitor.conf

# Sombra común para el texto: legible sobre fondos claros y oscuros
$text_shadow = rgba(0, 0, 0, 0.45)

general {
    # grace ya no existe en hyprlock 0.9: se pasa como `hyprlock --grace N`
    # Dibuja al instante aunque las imágenes aún carguen (importa al suspender)
    immediate_render = true
    hide_cursor = true
    # Enter sin escribir nada no cuenta como intento fallido (faillock bloquea con 3)
    ignore_empty_input = true
}

# Explícito: si una versión futura cambia los valores por defecto, el desbloqueo no depende de ello.
# /etc/pam.d/hyprlock incluye «login». Sin lector de huellas (fprintd no está instalado).
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = false
}

# Animaciones cortas: solo hay redibujado continuo mientras duran (velocidad en décimas de segundo)
animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldFade, 1, 3, easeOut
    animation = inputFieldWidth, 1, 3, easeOut
}

# ==========================================
# 🌌 FONDO (elegido con SUPER+CTRL+U)
# ==========================================

background {
    monitor = $LOCK_MONITOR
    path = ~/.cache/hyprlock/background
    # Si la imagen no carga, color liso de la paleta en vez de negro
    color = $background
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# Monitor apagado: negro liso (sin imagen ni blur, no cuesta nada). «none» = no existe → se ignora
background {
    monitor = $LOCK_OTHER
    color = rgb(000000)
}

# Prepara el fondo del próximo bloqueo (en modo aleatorio cambia). No muestra nada.
label {
    monitor = $LOCK_MONITOR
    text = cmd[update:0] setsid -f $HOME/.config/hypr/UserScripts/HyprlockBackground.sh --next >/dev/null 2>&1
    font_size = 1
    position = 0, 0
    halign = left
    valign = bottom
}

# ==========================================
# 🟩 COLUMNA IZQUIERDA: LOGIN
# ==========================================

# LOGO ARCH
label {
    monitor = $LOCK_MONITOR
    text = 󰣇
    color = $color13
    font_size = 80
    # Propo: el icono usa su ancho real (con la Mono/normal se recorta)
    font_family = JetBrainsMono Nerd Font Propo
    position = 120, 145
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $accent_glow
    shadow_boost = 1.2
}

# FOTO PERFIL
image {
    monitor = $LOCK_MONITOR
    path = $HOME/.config/hypr/profile-lock.png
    border_size = 3
    border_color = $color13
    size = 150
    rounding = -1
    position = 290, 145
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# CAJA USUARIO
shape {
    monitor = $LOCK_MONITOR
    size = 320, 55
    color = $surface
    rounding = 20
    border_size = 2
    border_color = $accent_soft
    position = 120, 0
    halign = left
    valign = center
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# TEXTO USUARIO
label {
    monitor = $LOCK_MONITOR
    text =   $USER
    color = $foreground
    font_size = 16
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 140, 0
    halign = left
    valign = center
}

# CAMPO PASSWORD (borde con el acento completo: es el elemento activo)
input-field {
    monitor = $LOCK_MONITOR
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $color13
    inner_color = $surface
    # font_color también es el color de los puntos
    font_color = $foreground
    check_color = $color14
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(f9e2af)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Medium
    placeholder_text = <i><span foreground="##ffffff99">󰌾  Introducir clave</span></i>
    hide_input = false
    rounding = 20
    position = 120, -75
    halign = left
    valign = center
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ==========================================
# 🟦 COLUMNA DERECHA: INFO
# ==========================================

# HORA
label {
    monitor = $LOCK_MONITOR
    text = $TIME
    color = $color13
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = -120, 145
    halign = right
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)
}

# FECHA
label {
    monitor = $LOCK_MONITOR
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +'%A, %d de %B' | sed 's/^./\U&/'
    color = $foreground
    font_size = 30
    font_family = JetBrainsMono Nerd Font Medium
    position = -120, 30
    halign = right
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $text_shadow
}

# ==========================================
# 🔻 INFERIOR DERECHA: ESTADO
# ==========================================

# CLIMA (LockScreen.sh refresca la caché justo después de bloquear: se relee cada 5 min)
label {
    monitor = $LOCK_MONITOR
    text = cmd[update:300000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = $color7
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    text_align = right
    position = -120, -90
    halign = right
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $text_shadow
}

# BATERÍA · TIEMPO ENCENDIDO (misma línea base que el texto de Spotify)
label {
    monitor = $LOCK_MONITOR
    text = cmd[update:30000] $HOME/.config/hypr/UserScripts/HyprlockStats.sh
    color = $color7
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -120, 65
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $text_shadow
}

# ==========================================
# 🎵 INFERIOR IZQUIERDA: SPOTIFY
# ==========================================

shape {
    monitor = $LOCK_MONITOR
    size = 320, 50
    color = $surface
    rounding = 20
    border_size = 2
    border_color = $accent_soft
    position = 120, 50
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor = $LOCK_MONITOR
    text = cmd[update:3000] echo "  $($Scripts/spotify.sh)"
    color = $foreground
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 140, 65
    halign = left
    valign = bottom
}
