# Hypridle 
# Original config submitted by https://github.com/SherLock707                                                       
                                                      
$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    # Elige el monitor del bloqueo (HDMI si está, si no el portátil) y lanza hyprlock si no está ya en marcha.
    # Si el script faltara o fallara, hyprlock se lanza igual (y se ve en todos los monitores).
    lock_cmd = pidof hyprlock || ($HOME/.config/hypr/scripts/HyprlockMonitor.sh; hyprlock)
    # unlock_cmd = killall hyprlock # kills hyprlock when unlocking (this is always run when "loginctl unlock-session" is called)
    before_sleep_cmd = loginctl lock-session    # ensures that the session is locked before going to sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' # turn of screen after sleep (not strictly necessary, but just in case)
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    # No suspender hasta que hyprlock haya bloqueado (3 = esperar al bloqueo de sesión)
    inhibit_sleep = 3
}

# 1. TRUCO DE BATERÍA MODO MANUAL: Si bloqueas tú a mano (CTRL + ALT + L o «Bloquear» en wlogout), apaga la pantalla a los 30 segundos
listener {
    timeout = 30                            
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' 
    on-resume = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   
}

