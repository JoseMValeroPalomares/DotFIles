# Screenlock: bloquea antes de suspender
listener {
    timeout = 270                     # 4.5 min
    on-timeout = loginctl lock-session # command to run when timeout has passed
    #on-resume = notify-send -i $iDIR " System Unlocked!"  # command to run when activity is detected after timeout has fired.
}

# 4. APAGADO DE PANTALLA: A los 5.5 minutos apaga el panel (Evita quemados y ahorra muchísima batería)
listener {
    timeout = 330                            
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    
}

