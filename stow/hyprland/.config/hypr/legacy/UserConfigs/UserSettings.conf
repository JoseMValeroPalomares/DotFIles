

### --- REGLAS DE VENTANAS (Nueva Sintaxis Hyprland 0.53+) --- ###

# Super Productivity al Escritorio 8
windowrule = match:class superProductivity, workspace 8

# Spotify al Escritorio 9
windowrule = match:class Spotify, workspace 6

# Calculadora flotante y centrada
windowrule = match:class qalculate-gtk, float on
windowrule = match:class qalculate-gtk, center on






# UserSettings.conf — transparencia suave sin blur
windowrule = match:tag browser,      opacity 1.0 1.0
windowrule = match:tag projects,     opacity 1.0 0.95
windowrule = match:tag settings,     opacity 1.0 0.95
windowrule = match:tag viewer,       opacity 1.0 0.95
windowrule = match:tag file-manager, opacity 1.0 0.90
windowrule = match:tag im,           opacity 1.0 0.95
windowrule = match:tag multimedia,   opacity 1.0 0.95

# Terminal un poco más transparente
windowrule = match:tag terminal,     opacity 1.0 0.85