# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


windowrule {
    name = reglas_superproductivity
    match:class = superproductivity
    opacity = 0.90 0.85
    float = on
}


# ── cronometro ────────────────────────────────────────────────

windowrule {
    name        = cronometro_float
    match:class = cronometro
    float       = on
}
windowrule {
    name        = cronometro_center
    match:class = cronometro
    center      = on
}
windowrule {
    name        = cronometro_size
    match:class = cronometro
    size        = 120 40
}

# keybinds.conf
bind = SUPER shift, B, exec, kitty --class cronometro -e cronometro