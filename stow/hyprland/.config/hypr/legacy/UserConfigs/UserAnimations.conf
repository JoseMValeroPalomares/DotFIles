# -----------------------------------------------------
# Animations - "Smooth & Premium" (Rápidas, Pop-in, sin rebotes feos)
# -----------------------------------------------------
animations {
    enabled = true
    
    # Curvas matemáticas optimizadas
    bezier = overshot, 0.05, 0.9, 0.1, 1.05      # Rebote sutil del 5% (Muy elegante)
    bezier = easeOutExpo, 0.16, 1, 0.3, 1        # Súper fluido, sin rebote (Para escritorios y cierres)
    bezier = smoothOut, 0.36, 0, 0.66, -0.56     # Curva limpia para desaparecer
    
    # Ventanas: Aparecen rápido desde el centro (popin) sin salirse de su sitio
    animation = windows, 1, 3, overshot, popin 90%
    animation = windowsIn, 1, 4, overshot, popin 90%      # <-- Arreglado el rebote del 156%
    animation = windowsOut, 1, 3, smoothOut, popin 80%    # <-- Cierre más limpio
    
    # Movimiento al reorganizar ventanas (adiós a la gelatina)
    animation = windowsMove, 1, 4, overshot, slide        # <-- Arreglado el encaje de las ventanas
    
    animation = border, 1, 5, default
    animation = fade, 1, 4, easeOutExpo
    animation = fadeDim, 1, 4, easeOutExpo
    
    # Cambio de escritorios (Intacto, este te encantaba)
    animation = workspaces, 1, 4, easeOutExpo, slide


# Animación para la terminal desplegable (Scratchpad)
    animation = specialWorkspace, 1, 4, overshot, slidevert
}