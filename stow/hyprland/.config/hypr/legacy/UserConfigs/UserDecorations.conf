# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  
  #gaps_in = 2
  #gaps_out = 4
  #col.active_border = $color12
  #col.inactive_border = $color10

  gaps_in = 3  # Un pelín más de espacio interior
  gaps_out = 4
  col.active_border = $color13 $color15 45deg
  col.inactive_border = $color2

}

decoration {
  rounding = 10
  
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.03
  dim_special = 0.5

  shadow {
    enabled = false
    range = 3
    render_power = 1

    color =  $color12
    #color_inactive = $color10
    color_inactive = 0x50000000
  }

  blur {
    enabled = false
    size = 4
    passes = 2
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = false
    popups = false
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
