# /* ---- 🐈‍⬛ KITTY THEME: CATPPUCCIN SAPPHIRE & LAVENDER 🐈‍⬛ ---- */

# --- Textos y Fondos Base ---
background              #1e1e2e
foreground              #cdd6f4
selection_background    #cba6f7
selection_foreground    #1e1e2e

# --- Cursor (Morado brillante) ---
cursor                  #cba6f7
cursor_text_color       #1e1e2e
cursor_shape            beam
cursor_blink_interval   0.5

# --- Enlaces (Zafiro) ---
url_color               #74c7ec
url_style               curly

# --- Bordes de Ventana ---
active_border_color     #b4befe
inactive_border_color   #313244
bell_border_color       #f9e2af

# --- Pestañas (Tabs) ---
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# --- Los 16 Colores de la Terminal ---

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue (Zafiro puro)
color4  #89b4fa
color12 #74c7ec

# Magenta / Morado (Mauve & Lavender)
color5  #cba6f7
color13 #b4befe

# Cyan
color6  #94e2d5
color14 #89dceb

# White
color7  #bac2de
color15 #a6adc8