# /* ---- 🧊 KITTY ELEGANT GLASS EDITION 🧊 ---- */

font_family      FantasqueSansM Nerd Font Mono
font_size        14.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# ==========================================
# EFECTO CRISTAL (Transparencia y Márgenes)
# ==========================================
# Aquí está la magia. Un fondo muy transparente para que Hyprland haga el blur
background_opacity         0.55
dynamic_background_opacity yes

# Márgenes amplios: dan un aspecto brutal y muy limpio al cristal
window_padding_width       15

confirm_os_window_close    0
linux_display_server       auto

# ==========================================
# RENDIMIENTO (monitores a 144 Hz)
# ==========================================
# Un fotograma a 144 Hz dura 6.9 ms: con el valor por defecto (10 ms) kitty se
# quedaba en ~100 fps. sync_to_monitor (activo por defecto) evita gastar de más.
repaint_delay              6
# Espera antes de procesar la entrada del programa (por defecto 3 ms)
input_delay                2

# ==========================================
# COMPORTAMIENTO MODERNO
# ==========================================
# Estela solo si el cursor llevaba 3 ms quieto y salta más de 3 celdas:
# así no parpadea con cada tecla ni en los redibujados de nvim/TUIs
cursor_trail               3
cursor_trail_start_threshold 3
cursor_shape               beam
cursor_blink_interval      0.5
copy_on_select             yes
scrollback_lines           5000
wheel_scroll_min_lines     3
enable_audio_bell          no
# Ocultar la barra superior (si tu gestor de ventanas la dibuja)
hide_window_decorations    yes 

# ==========================================
# COLORES (Alto contraste para fondos transparentes)
# ==========================================
# Fondo negro puro translúcido y texto blanco/gris crujiente
background              #000000
foreground              #e0e0e0
cursor                  #ffffff

# Selección invertida clásica y limpia
selection_background    #ffffff
selection_foreground    #000000

# Paleta "Neon/Vibrant" para que los comandos resalten sobre el cristal
color0  #2a2a2a
color8  #4a4a4a
color1  #ff5c57
color9  #ff5c57
color2  #5af78e
color10 #5af78e
color3  #f3f99d
color11 #f3f99d
color4  #57c7ff
color12 #57c7ff
color5  #ff6ac1
color13 #ff6ac1
color6  #9aedfe
color14 #9aedfe
color7  #f1f1f0
color15 #f1f1f0

# Acentos de Wallust (cursor, estela, enlaces, bordes de splits).
# Va después para que mande sobre el cursor de arriba. Lo genera la plantilla
# ~/.config/wallust/templates/colors-kitty-accents.conf en cada cambio de fondo.
# Para volver a los colores fijos de antes: comenta esta línea.
include wallust-accents.conf

# Enlaces subrayados con ondas en el color de acento
url_style             curly

# ==========================================
# ATAJOS DESACTIVADOS (pestañas, splits y scroll los lleva tmux)
# ==========================================
# Los hints pintan su propia capa de colores y las pestañas/splits de kitty crean
# ventanas que no son tu terminal con tmux: fuera, para que nada cambie el aspecto.
map kitty_mod+e     no_op
map kitty_mod+p>f   no_op
map kitty_mod+p>shift+f no_op
map kitty_mod+p>h   no_op
map kitty_mod+p>l   no_op
map kitty_mod+p>n   no_op
map kitty_mod+p>w   no_op
map kitty_mod+p>y   no_op
map kitty_mod+p>c   no_op
map kitty_mod+p>d   no_op
map kitty_mod+t     no_op
map kitty_mod+enter no_op
map kitty_mod+l     no_op
