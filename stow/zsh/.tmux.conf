# ==========================================
# 1. CONFIGURACIÓN BASE Y COLORES (TRUE COLOR)
# ==========================================
# Necesario para que Kitty y Tmux entiendan los colores HEX (Catppuccin)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Quitar el retraso al pulsar ESC
set -s escape-time 0

# Empezar a contar ventanas desde el 1 (el 0 pilla muy lejos en el teclado)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================================
# 2. CONTROLES PRINCIPALES (ATAJOS)
# ==========================================
# Cambiar el prefijo de Ctrl+B a Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Crear nueva ventana (pestaña) - [Prefijo + c]
bind c new-window -c "#{pane_current_path}"

# Dividir pantalla (Mantiene la carpeta en la que estás)
# 'v' hace una división Vertical (te pone un panel a la derecha)
# 'h' hace una división Horizontal (te pone un panel abajo)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Eliminar panel actual sin que pregunte "Are you sure?" - [Prefijo + x]
bind x kill-pane

# Renombrar la ventana actual - [Prefijo + n] (de Name)
bind n command-prompt -I "#W" "rename-window '%%'"

# Recargar la configuración de tmux al vuelo - [Prefijo + r]
bind r source-file ~/.tmux.conf \; display "¡Tmux recargado!"

# ==========================================
# 3. EXTRAS PRO: NAVEGACIÓN RÁPIDA
# ==========================================
# Moverse entre paneles con Alt + Flechas (¡SIN usar el prefijo Ctrl+A!)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==========================================
# 4. RATÓN Y PORTAPAPELES (WAYLAND + KITTY)
# ==========================================
set -g mouse on
setw -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ==========================================
# 5. TEMA VISUAL: CATPPUCCIN MOCHA VIVID
# ==========================================

# --- Color del texto seleccionado (Adiós al amarillo feo) ---
# Fondo Lavanda suave (#b4befe) con texto muy oscuro (#11111b)
set -g mode-style "fg=#11111b,bg=#b4befe"

# --- Líneas separadoras de los paneles ---
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa" # Azul cielo para el panel activo

# --- Barra de estado (La barra de abajo) ---
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4" # Fondo oscuro, texto claro

# --- Diseño de las pestañas (Ventanas) ---
# Ventana inactiva (Gris)
setw -g window-status-format "#[fg=#cdd6f4,bg=#313244] #I #[fg=#cdd6f4,bg=#45475a] #W "
# Ventana activa (Morado Mauve brillante)
setw -g window-status-current-format "#[fg=#11111b,bg=#cba6f7,bold] #I #[fg=#cdd6f4,bg=#313244,nobold] #W "

# --- Módulos de la derecha (Nombre de sesión y Reloj) ---
set -g status-right "#[fg=#11111b,bg=#89b4fa,bold]  #S #[fg=#11111b,bg=#a6e3a1,bold]  %H:%M "
set -g status-left ""
set -g status-left-length 0

# ==========================================
# 6. BARRA DE ESTADO PRO (CATPPUCCIN MOCHA)
# ==========================================

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 200

# ==========================================
# STATUS RIGHT — MOCHA CLEAN FIXED
# ==========================================

set -g status-right "\
#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] 󰍛 #(grep 'cpu ' /proc/stat | awk '{u=($2+$4)*100/($2+$4+$5)} END {printf \"%02d\", u}')% \
#[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a] 󰘚 #(free -h | awk '/Mem:/ {print \$3\"/\"\$2}') \
#[fg=#585b70,bg=#45475a]#[fg=#cdd6f4,bg=#585b70] 󰁹 #(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)% \
#[fg=#6c7086,bg=#585b70]#[fg=#cdd6f4,bg=#6c7086] %a %d %b \
#[fg=#5c5f77,bg=#6c7086]#
[fg=#cdd6f4,bg=#5c5f77,bold] %H:%M \
#[fg=#5c5f77,bg=#1e1e2e]"


# Cada kitty abre su propia sesión (ZSH_TMUX_AUTOCONNECT=false en .zshrc): al cerrar la
# ventana, la sesión se destruye en vez de quedarse huérfana en segundo plano.
# Para conservar una a propósito: tmux set destroy-unattached off (dentro de ella) y C-a d.
set -g destroy-unattached on

# Historial de cada panel (por defecto 2000)
set -g history-limit 3000
