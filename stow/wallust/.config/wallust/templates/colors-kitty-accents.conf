# /* wallust template - kitty: solo acentos */
# Fondo, texto y paleta ANSI son fijos en kitty.conf (la paleta de Wallust es demasiado oscura
# para texto). Aquí solo lo que conviene que siga al fondo de pantalla.
# Se usan color14/color15: en las paletas dark* son los más claros → buen contraste sobre negro.

# Cursor claro para que se vea siempre; la estela con el acento
cursor                 {{color15}}
cursor_trail_color     {{color14}}

# Enlaces
url_color              {{color14}}

# Bordes entre splits
active_border_color    {{color14}}
inactive_border_color  #4a4a4a
bell_border_color      #ff5c57
