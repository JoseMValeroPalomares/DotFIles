# zram es RAM comprimida: conviene que el kernel la use antes de tirar caché de disco
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.vfs_cache_pressure = 50
# Escritura a disco en bloques más pequeños: menos tirones al copiar archivos grandes
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# Watchdog NMI desactivado: menos interrupciones y algo menos de consumo
kernel.nmi_watchdog = 0
